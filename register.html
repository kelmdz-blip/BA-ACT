<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link rel="stylesheet" href="login.css" />
    <script
      src="https://code.jquery.com/jquery-3.7.1.js"
      integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.22.1/jquery.validate.min.js"
      integrity="sha512-qu7dMuIm2f0KcKZ3BOoP4c+Hn+r4E8PbD2Ro4rmKsOyheCxcwhzQpf6SojA76dn+owqfANzfTFUTkGA+HpHjOA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </head>

  <body>
    <div class="register-container">
      <h1>Register</h1>

      <form class="register-form" id="registerForm">
        <!-- Username -->
        <div class="input-box">
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Username"
            autocomplete="username"
            required
            minlength="3"
          />

          <!-- Person Icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            class="input-icon"
            viewBox="0 0 16 16"
          >
            <path
              d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"
            />
          </svg>
        </div>

        <!-- Email -->
        <div class="input-box">
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Email"
            autocomplete="email"
            required
          />

          <!-- Envelope Icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            class="input-icon"
            viewBox="0 0 16 16"
          >
            <path
              d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V4zm2-.5a.5.5 0 0 0-.5.5v.217l6.5 4.5 6.5-4.5V4a.5.5 0 0 0-.5-.5H2z"
            />
          </svg>
        </div>

        <!-- Password -->
        <div class="input-box">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            autocomplete="new-password"
            required
            minlength="8"
          />

          <!-- Lock Icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            class="input-icon"
            viewBox="0 0 16 16"
          >
            <path d="M8 1a3 3 0 0 0-3 3v3h6V4a3 3 0 0 0-3-3z" />
            <path
              d="M3 7a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2H3z"
            />
          </svg>
        </div>

        <!-- Confirm Password -->
        <div class="input-box">
          <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            placeholder="Confirm Password"
            autocomplete="new-password"
            required
          />

          <!-- Lock Icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            class="input-icon"
            viewBox="0 0 16 16"
          >
            <path d="M8 1a3 3 0 0 0-3 3v3h6V4a3 3 0 0 0-3-3z" />
            <path
              d="M3 7a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2H3z"
            />
          </svg>
        </div>

        <!-- Register Button -->
        <button type="submit" class="register-btn">Register</button>

        <!-- Login Link -->
        <p class="login-link">
          Already have an account?
          <a href="login.html">Login Here</a>
        </p>
      </form>
    </div>

    <script>
      $(document).ready(function () {
        $("#registerForm").validate({
          rules: {
            username: {
              required: true,
              minlength: 3,
              maxlength: 10,
            },

            email: {
              required: true,
              email: true,
            },

            password: {
              required: true,
              minlength: 8,
            },

            "confirm-password": {
              required: true,
              equalTo: "#password",
            },
          },

          messages: {
            username: {
              required: "Please enter your username.",
              minlength: "Username must be at least 3 characters.",
            },

            email: {
              required: "Please enter your email address.",
              email: "Please enter a valid email address.",
            },

            phone: {
              required: "Please enter your phone number.",
              pattern: "Enter an 11-digit mobile number starting with 09.",
            },

            password: {
              required: "Please enter your password.",
              minlength: "Password must be at least 8 characters.",
            },

            "confirm-password": {
              required: "Please confirm your password.",
              equalTo: "Passwords do not match.",
            },
          },

          errorElement: "label",
          errorClass: "error",
          validClass: "valid",

          errorPlacement: function (error, element) {
            error.insertAfter(element.closest(".input-box"));
          },

          submitHandler: function (form) {
            alert("Registration successful!");
            window.location.href = "login.html";
            return false;
          },
        });
      });
    </script>
  </body>
</html>
