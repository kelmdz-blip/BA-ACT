<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link rel="stylesheet" href="login.css" />
  </head>

  <body>
    <div class="register-container">
      <h1>Register</h1>

      <form class="register-form">
        <!-- Username -->
        <div class="input-box">
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Username"
            required
          />

          <!-- Person Icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            class="input-icon"
            viewBox="0 0 16 16"
          >
            <path
              d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"
            />
          </svg>
        </div>

        <!-- Email -->
        <div class="input-box">
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Email"
            required
          />

          <!-- Envelope Icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            class="input-icon"
            viewBox="0 0 16 16"
          >
            <path
              d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V4zm2-.5a.5.5 0 0 0-.5.5v.217l6.5 4.5 6.5-4.5V4a.5.5 0 0 0-.5-.5H2z"
            />
          </svg>
        </div>

        <!-- Phone Number -->
        <div class="input-box">
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Phone Number"
            required
          />

          <!-- Telephone Icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            class="input-icon"
            viewBox="0 0 16 16"
          >
            <path
              fill-rule="evenodd"
              d="M1.885.511a1.745 1.745 0 0 1 2.61.163L6.29 2.98c.329.423.445.974.315 1.494l-.547 2.19a.68.68 0 0 0 .178.643l2.457 2.457a.68.68 0 0 0 .644.178l2.189-.547a1.75 1.75 0 0 1 1.494.315l2.306 1.794c.829.645.905 1.87.163 2.611l-1.034 1.034c-.74.74-1.846 1.065-2.877.702a18.6 18.6 0 0 1-7.01-4.42 18.6 18.6 0 0 1-4.42-7.009c-.362-1.03-.037-2.137.703-2.877z"
            />
          </svg>
        </div>

        <!-- Password -->
        <div class="input-box">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required
          />

          <!-- Lock Icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            class="input-icon"
            viewBox="0 0 16 16"
          >
            <path d="M8 1a3 3 0 0 0-3 3v3h6V4a3 3 0 0 0-3-3z" />
            <path
              d="M3 7a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2H3z"
            />
          </svg>
        </div>

        <!-- Confirm Password -->
        <div class="input-box">
          <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            placeholder="Confirm Password"
            required
          />

          <!-- Lock Icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            class="input-icon"
            viewBox="0 0 16 16"
          >
            <path d="M8 1a3 3 0 0 0-3 3v3h6V4a3 3 0 0 0-3-3z" />
            <path
              d="M3 7a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2H3z"
            />
          </svg>
        </div>

        <!-- Register Button -->
        <button type="submit" class="register-btn">Register</button>

        <!-- Login Link -->
        <p class="login-link">
          Already have an account?
          <a href="login.html">Login Here</a>
        </p>
      </form>
    </div>
  </body>
</html>
