<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <link rel="stylesheet" href="login.css" />
  </head>

  <body>
    <div class="login-container">
      <h1>Van Gogh Collection</h1>

      <form class="login-form">
        <!-- Username -->
        <div class="input-box">
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Username"
            required
          />

          <!-- Person Icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            class="input-icon"
            viewBox="0 0 16 16"
          >
            <path
              d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"
            />
          </svg>
        </div>

        <!-- Password -->
        <div class="input-box">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required
          />

          <!-- Lock Icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            class="input-icon"
            viewBox="0 0 16 16"
          >
            <path d="M8 1a3 3 0 0 0-3 3v3h6V4a3 3 0 0 0-3-3z" />
            <path
              d="M3 7a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2H3z"
            />
          </svg>
        </div>

        <!-- Options -->
        <div class="options">
          <label>
            <input type="checkbox" name="remember" />
            Remember me
          </label>

          <a href="#" class="link-primary"> Forgot password </a>
        </div>

        <!-- Login Button -->
        <button type="submit" class="login-btn">Login</button>

        <!-- Register -->
        <p class="register">
          Don’t have an account?
          <a href="register.html">Register</a>
        </p>
      </form>
    </div>
  </body>
</html>
